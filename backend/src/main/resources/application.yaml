spring:
  profiles:
    active: local

  datasource:
    url:      ${DATABASE_URL:jdbc:mariadb://localhost:3306/hotel_bahia}
    username: ${DATABASE_USERNAME:hotel}
    password: ${DATABASE_PASSWORD:hotel_bahia}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  jackson:
    time-zone: America/Lima

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-for-hotel-bahia-not-for-production-use-only-32chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  timezone: America/Lima