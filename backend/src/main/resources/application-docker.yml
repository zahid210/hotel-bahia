# Perfil para ejecutar dentro de Docker Compose.
# Se activa con SPRING_PROFILES_ACTIVE=docker desde docker-compose.yml.
spring:
  datasource:
    url:      ${DATABASE_URL:jdbc:mariadb://db:3306/hotel_bahia}
    username: ${DATABASE_USERNAME:hotel}
    password: ${DATABASE_PASSWORD:hotel_bahia}

  jpa:
    hibernate:
      # update: crea/actualiza el esquema si falta, sin borrar datos
      ddl-auto: update
    show-sql: false

app:
  jwt:
    # Sin default: el header de docker-compose exige JWT_SECRET en .env.
    # Un secreto conocido permitiría forjar tokens a cualquiera con acceso al repo.
    secret:         ${JWT_SECRET}
    expiration-ms:  ${JWT_EXPIRATION_MS:86400000}
  timezone: ${APP_TIMEZONE:America/Lima}
  admin:
    email:    ${APP_ADMIN_EMAIL:zahidmatos@hotel.com}
    nombre:   ${APP_ADMIN_NOMBRE:Zahid Matos}
    password: ${APP_ADMIN_PASSWORD:}