services:
  db:
    image: mysql:8
    container_name: hotel-bahia-db
    restart: unless-stopped
    # Puerto 3307 en el host (el 3306 del sistema suele estar ocupado
    # por un MySQL/MariaDB local). Si usas este contenedor, apunta
    # application-local.yml a jdbc:mariadb://localhost:3307/hotel_bahia
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hotel_bahia
      MYSQL_USER: hotel
      MYSQL_PASSWORD: hotel_bahia
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata: